[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-transfer"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "openpyxl>=3.1,<4", "xlrd>=2,<3", "Pillow>=11", "httpx>=0.28,<1", "cryptography>=45,<47"]

[tool.setuptools.package-data]
marketplace_transfer = ["updating/update_config.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt", "pyinstaller>=6", "playwright>=1.50", "xlwt==1.3.0"]

[project.scripts]
marketplace-transfer = "marketplace_transfer.app:main"

[tool.setuptools.packages.find]
include = ["marketplace_transfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
